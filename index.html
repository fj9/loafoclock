<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9A4A22">
    <meta name="description" content="A free sourdough planner that shows how feed, temperature and the fridge move your bake, so you can fit it around your day.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Loaf O'Clock">
    <script>
        // Apply the saved theme and text size before the page paints, so there is no flash.
        try { var t = localStorage.getItem('loafoclockTheme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
        try { var st = JSON.parse(localStorage.getItem('loafoclockSettings') || '{}'); document.documentElement.dataset.hints = st.hints === false ? 'off' : 'on'; if (st.textSize === 'large' || st.textSize === 'larger') document.documentElement.dataset.text = st.textSize; } catch (e) {}
    </script>
    <title>Loaf O'Clock · a sourdough planner</title>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
