name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site (version asset URLs so browsers never mix old and new files)
        run: |
          mkdir _site && cp index.html styles.css shell.js app.js _site/
          sed -i "s#\(styles.css\|shell.js\|app.js\)\"#\1?v=${GITHUB_SHA::7}\"#" _site/index.html
          grep -n "?v=" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
